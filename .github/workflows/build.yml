name: Build VenueOS Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure stable debug keystore
        run: |
          # A fresh debug.keystore per CI run signs each build differently,
          # which breaks `adb install -r` upgrades (signature mismatch) and
          # forces a full uninstall (losing pairing state) on every deploy.
          # Committing one keystore keeps every build signed identically.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=JJJK VenueOS,OU=JJJK,O=JJJK Entertainment,L=Geelong,S=VIC,C=AU"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add stable debug keystore for consistent CI signing"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Generate launcher icons
        run: |
          python3 - <<'EOF'
          import struct, zlib, os

          def make_png(w, h, r, g, b):
              def chunk(tag, data):
                  c = tag + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              rows = b''.join(b'\x00' + bytes([r, g, b] * w) for _ in range(h))
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(rows))
                      + chunk(b'IEND', b''))

          densities = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
                       'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, size in densities.items():
              path = f'app/src/main/res/{d}'
              os.makedirs(path, exist_ok=True)
              png = make_png(size, size, 0x18, 0x26, 0x20)
              open(f'{path}/ic_launcher.png', 'wb').write(png)
              open(f'{path}/ic_launcher_round.png', 'wb').write(png)
          print('Icons generated')
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APKs (both flavors)
        run: gradle assembleStandardDebug assembleAutolaunchDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload standard APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: venueos-player-standard-${{ github.run_number }}
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          retention-days: 30

      - name: Upload autolaunch APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: venueos-player-autolaunch-${{ github.run_number }}
          path: app/build/outputs/apk/autolaunch/debug/app-autolaunch-debug.apk
          retention-days: 30

      - name: Deploy autolaunch APK to admin dashboard
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN not set — skipping deploy (add it in GitHub repo secrets)"
            exit 0
          fi
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          echo "Deploying version $VERSION"
          curl -X POST https://admin.venueos.jjjk.com.au/api/deploy/android-apk \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            -H "X-App-Version: $VERSION" \
            --data-binary @app/build/outputs/apk/autolaunch/debug/app-autolaunch-debug.apk \
            --fail \
            --silent \
            --show-error
          echo "APK deployed — version $VERSION"
